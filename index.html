<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>QR Contact Generator</title>

    <link rel="stylesheet" href="style.css">

    <!-- QR Code Library -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
</head>

<body>
<nav>
    <div>
        <a href="/ICall/call.html">Caller</a>
    </div>
</nav>
    <div class="container">

        <div class="card">

            <div class="header">
                <h1>QR Contact</h1>
                <p>Create your private contact QR code</p>
            </div>

            <div class="form-group">

                <label for="name">
                    Your Name
                </label>

                <input
                    type="text"
                    id="name"
                    placeholder="Enter your name"
                    autocomplete="off"
                >

            </div>

            <button id="generateBtn">
                Generate QR Code
            </button>

            <div id="qrSection" class="qr-section hidden">

                <h2>Your QR Code</h2>

                <div id="qrcode"></div>

                <p id="contactId" class="contact-id"></p>

                <button id="downloadBtn" class="download-btn">
                    Download QR
                </button>

            </div>

        </div>

    </div>

    <script src="script.js"></script>

</body>
</html>
